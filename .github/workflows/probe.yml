name: 公式ページの形の確認(一時的)

# オッズの取り込みを作るために、公式サイトのオッズのページをそのまま保存して形を確かめる(確かめたら消す)。
# 保存先は odds ブランチ(オッズの取り込みが使うブランチ。取り込みが始まると中身は置きかわる)。
on:
  workflow_dispatch:
    inputs:
      races:
        description: "場コード-レース番号(空白区切り)"
        default: "04-5 01-1"
      pages:
        description: "ページ(空白区切り)"
        default: "odds3t odds3f odds2tf oddsk oddstf"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ページを保存して odds ブランチへ送る
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          RACES: ${{ github.event.inputs.races }}
          PAGES: ${{ github.event.inputs.pages }}
        run: |
          HD=$(TZ=Asia/Tokyo date +%Y%m%d)
          mkdir -p /tmp/out/probe && cd /tmp/out
          for r in $RACES; do
            for p in $PAGES; do
              curl -sS -A "boatrace-site/0.1 (+https://github.com/$REPO)" "https://www.boatrace.jp/owpc/pc/race/$p?rno=${r#*-}&jcd=${r%-*}&hd=$HD" -o "probe/$p-$r.html" || true
              sleep 2
            done
          done
          ls -la probe
          git init -q -b odds && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "公式ページの形の確認 $HD"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" odds
