name: 毎日の更新

on:
  schedule:
    - cron: "20 15 * * *"  # 毎日 0:20(日本時間): 前日の成績と今日の番組表・学習
    - cron: "20 17 * * *"  # 毎日 2:20(日本時間): 予約の起動が遅れた・落ちたときの取り直し
    - cron: "20 20 * * *"  # 毎日 5:20(日本時間): 同上(朝のレースの前に番組表とページをそろえる)
    - cron: "10 22 * * *"  # 毎日 7:10(日本時間): 取りこぼしの再取得
    - cron: "10 8 * * *"   # 毎日 17:10(日本時間): 明日の番組表(出ていれば)
  workflow_dispatch:
    inputs:
      backfill:
        description: "1回で取り込む過去の成績の日数"
        default: "10"
      refetch:
        description: "1回で取り直す古い成績の日数"
        default: "12"
      grades:
        description: "1回で取り込む過去の開催グレードの日数"
        default: "20"
  push:
    branches: [main]
    paths: ["scripts/**", "site/**", "data/stadiums.json", ".github/workflows/update.yml"]

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # 予約の時点ではなく、始まった時点の最新から(ほかの実行が送ったデータの上に足す)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 解凍ツールと計算用のライブラリを入れる
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lhasa
          pip install -q numpy scipy
      - name: 公式データを取り込んで学習し、サイトを作る
        env:
          BACKFILL_PER_RUN: ${{ github.event.inputs.backfill || '10' }}
          REFETCH_PER_RUN: ${{ github.event.inputs.refetch || '12' }}
          GRADE_PER_RUN: ${{ github.event.inputs.grades || '20' }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: python3 scripts/update.py
      - name: 取り込んだデータを保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git commit -m "データ更新 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M') [skip ci]"; then
            for i in 1 2 3 4; do
              if git pull --rebase -q origin main || { git rebase --abort; git pull --rebase -X theirs -q origin main; }; then
                git push && break
              fi
              sleep 5
            done
          else
            echo "変更なし"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
