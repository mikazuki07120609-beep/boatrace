name: 直前情報ページの見本を取る(開発用・一時的)
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "kind:jcd-rno をスペース区切り(kind は before / result / list)"
        required: true
      day:
        description: "YYYYMMDD"
        required: true
jobs:
  sample:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 見本を取る
        run: |
          mkdir -p out
          for p in ${{ github.event.inputs.pages }}; do
            kind=${p%%:*}; r=${p#*:}; jcd=${r%-*}; no=${r#*-}
            case $kind in before) path=beforeinfo;; result) path=raceresult;; list) path=racelist;; *) path=$kind;; esac
            curl -sS --max-time 40 -A "suimen-note/1.0 (+https://mikazuki07120609-beep.github.io/boatrace/)" \
              "https://www.boatrace.jp/owpc/pc/race/${path}?rno=${no}&jcd=${jcd}&hd=${{ github.event.inputs.day }}" -o "out/${kind}_${jcd}_${no}.html" || true
            sleep 3
          done
          ls -la out
      - name: 見本を開発用の枝に置く
        run: |
          cd out
          git init -q -b dev-samples
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "見本"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dev-samples
