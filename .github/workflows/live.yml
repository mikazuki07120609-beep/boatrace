name: 直前情報と結果(開催中)

# 開催中ずっと動かし、締切の前後に各レースの直前情報(展示)と結果を公式サイトから読み取って、
# data/live/ に入れてすぐリポジトリへ送る。レースのページは開くたびにこのファイルを読みに来る。
# 1回の実行は最長345分。終わるときに今日の分が残っていれば、自分で次の実行を起こして引き継ぐ。
# 予約の起動は遅れたり落ちたりすることがあるので、朝6:40から1時間おきにも起動を予約しておく
# (同時に動くのは1つだけ。動いている間に来た起動は待たされ、前の実行が終わるとすぐ始まる)。
on:
  schedule:
    - cron: "40 21 * * *"              # 6:40(日本時間)
    - cron: "20 22,23,0-13 * * *"      # 7:20〜22:20 の毎時
  workflow_dispatch:
    inputs:
      minutes:
        description: "何分まで動かすか"
        default: "345"

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    permissions:
      contents: write
      actions: write          # 次の実行・毎日の更新を起こすため
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # 予約の時点ではなく、始まった時点の最新から(ほかの実行が送ったデータの上に足す)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 締切の前後に、直前情報と結果を読み取ってリポジトリへ送る
        env:
          GH_TOKEN: ${{ github.token }}
          # Cloudflare R2(ページが先に読みに行く置き場所)。設定していなければ GitHub の方だけに送る
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # X への大荒れ注意の自動投稿(scripts/xpost.py)。4つとも入れたときだけ投稿する。1日の上限は X_DAILY_MAX(変数。ふだん 3。X API は1件ごとの料金)
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_DAILY_MAX: ${{ vars.X_DAILY_MAX }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/live.py --loop "${{ github.event.inputs.minutes || '345' }}" --push
      - name: 今日の分が残っていれば、次の実行を起こして引き継ぐ
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 scripts/live.py --need-more; then
            gh workflow run live.yml --ref main && echo "次の実行を起こしました"
          else
            echo "今日の分は終わりです"
          fi
