name: Cloudflare の置き場所の確認

# Cloudflare R2・独自ドメインの設定がすんだら、手で動かして確かめる(ふだんは動かない)。
#  1. 秘密の値で、確かめ用の小さなファイル(check.json)を R2 に送れるか
#  2. data_base を入れたときは、公開のURLから読めるか(サイトから読むための CORS と、Cloudflare の中継の使い回し)
#  3. site を入れたときは、サイトのURLが開けるか(HTTPS・中身)と、これまでのURLから転送されるか
# 結果は実行の注記(annotation)にも残す(実行の記録を読めないときも、API で確かめられる)。
on:
  workflow_dispatch:
    inputs:
      data_base:
        description: "データの公開URL(例: https://data.example.com/)。空なら送るところまで"
        default: ""
      origin:
        description: "サイトのオリジン(CORS の確認用。例: https://example.com)"
        default: ""
      site:
        description: "サイトのURL(開けるかの確認。例: https://example.com/)"
        default: ""
      keys:
        description: "データの公開URLから読んでみるキー(空白区切り。例: live/20261029/01.json odds/20261029/01/12.json)"
        default: ""
      page:
        description: "ブラウザで開いてみるページ(例: https://example.com/20261029/01/09.html)。どこからデータを読んだかを数える"
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 確かめ用のファイルを R2 に送る
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 scripts/r2.py --check
      - name: 同じ合鍵を AWS CLI でも試す(合鍵そのものが合っているかの切り分け)
        if: ${{ always() }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          ACCT: ${{ secrets.R2_ACCOUNT_ID }}
          RAW_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RAW_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          # 前後に空白や改行が入っていないか(値そのものは出さない)
          t1=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]'); t2=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          echo "::notice title=合鍵の前後の空白::Access Key ID ${#RAW_KEY}→${#t1}文字 / Secret ${#RAW_SECRET}→${#t2}文字"
          # アカウントID の末尾(ダッシュボードのアドレスに出ているもの。秘密ではない)と照らし合わせ、入れ替わっていないかを見る
          tail_id="164c752f3a36c146b3"
          a=no; k=no
          case "$(printf '%s' "$ACCT" | tr -d '[:space:]')" in *"$tail_id") a=yes;; esac
          case "$t1" in *"$tail_id") k=yes;; esac
          echo "::notice title=アカウントIDの照らし合わせ::R2_ACCOUNT_ID の末尾が一致: ${a} / R2_ACCESS_KEY_ID の末尾が一致(入れ替わり): ${k}"
          export AWS_ACCESS_KEY_ID="$t1" AWS_SECRET_ACCESS_KEY="$t2"
          ACCT=$(printf '%s' "$ACCT" | tr -d '[:space:]')
          echo '{"cli":true}' > c.json
          if out=$(aws s3api put-object --endpoint-url "https://${ACCT}.r2.cloudflarestorage.com" --bucket suimen-data --key check-cli.json --body c.json --content-type application/json 2>&1); then
            echo "::notice title=AWS CLI::送れました $(printf '%s' "$out" | tr '\n' ' ' | head -c 200)"
          else
            echo "::warning title=AWS CLI::送れませんでした $(printf '%s' "$out" | tr '\n' ' ' | head -c 300)"
          fi
          if out=$(aws s3api list-objects-v2 --endpoint-url "https://${ACCT}.r2.cloudflarestorage.com" --bucket suimen-data --max-items 3 --query 'Contents[].Key' --output text 2>&1); then
            echo "::notice title=AWS CLI 一覧::$(printf '%s' "$out" | tr '\n' ' ' | head -c 200)"
          else
            echo "::warning title=AWS CLI 一覧::読めませんでした $(printf '%s' "$out" | tr '\n' ' ' | head -c 300)"
          fi
      - name: 公開のURLから読めるか(CORS と中継の使い回し)
        if: ${{ always() && github.event.inputs.data_base != '' }}
        env:
          BASE: ${{ github.event.inputs.data_base }}
          ORIGIN: ${{ github.event.inputs.origin }}
        run: |
          u="${BASE%/}/check.json?t=$(date +%s)"
          args=()
          if [ -n "$ORIGIN" ]; then args=(-H "Origin: $ORIGIN"); fi
          for i in 1 2; do
            h=$(curl -sS -D - -o body.txt "${args[@]}" "$u" 2>err.txt || true)
            pick() { printf '%s\n' "$h" | grep -i "^$1:" | head -1 | tr -d '\r'; }
            st=$(printf '%s\n' "$h" | head -1 | tr -d '\r')
            echo "::notice title=データの公開URL ${i}回目::${st} / $(pick access-control-allow-origin) / $(pick cf-cache-status) / $(pick cache-control) / $(head -c 120 body.txt | tr -d '\r\n') $(head -c 160 err.txt | tr -d '\r\n')"
            sleep 2
          done
      - name: 取り込みが送ったデータを読んでみる
        if: ${{ always() && github.event.inputs.data_base != '' && github.event.inputs.keys != '' }}
        env:
          BASE: ${{ github.event.inputs.data_base }}
          KEYS: ${{ github.event.inputs.keys }}
        run: |
          for k in $KEYS; do
            h=$(curl -sS -D - -o d.json "${BASE%/}/$k?t=$(date +%s)" 2>err.txt || true)
            st=$(printf '%s\n' "$h" | head -1 | tr -d '\r')
            lm=$(printf '%s\n' "$h" | grep -i '^last-modified:' | head -1 | tr -d '\r')
            info=$(python3 -c "import json,sys; d=json.load(open('d.json')); print('updated', d.get('updated') or d.get('at') or d.get('t'), '/ keys', ','.join(sorted(d.keys()))[:120])" 2>/dev/null || head -c 100 d.json)
            echo "::notice title=データ ${k}::${st} / ${lm} / ${info} $(head -c 120 err.txt | tr -d '\r\n')"
          done
      - name: ブラウザでページを開き、どこからデータを読んだかを数える
        if: ${{ always() && github.event.inputs.page != '' }}
        env:
          PAGE: ${{ github.event.inputs.page }}
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null && npm i -s playwright@1.56.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > look.js <<'JS'
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch(); const pg = await b.newPage();
            const seen = []; const errs = [];
            pg.on("response", (r) => { const u = r.url(); if (/data\.suimennote\.com|raw\.githubusercontent\.com/.test(u)) seen.push(r.status() + " " + u.replace(/\?t=\d+/, "").replace("https://", "")); });
            pg.on("requestfailed", (r) => { const u = r.url(); if (/data\.suimennote\.com|raw\.githubusercontent\.com/.test(u)) seen.push("失敗 " + (r.failure() || {}).errorText + " " + u.replace(/\?t=\d+/, "").replace("https://", "")); });
            pg.on("console", (m) => { if (m.type() === "error") errs.push(m.text().slice(0, 160)); });
            await pg.goto(process.env.PAGE, { waitUntil: "load" }); await pg.waitForTimeout(4000);
            const odds = await pg.$('.tabs [data-tab="odds"]'); if (odds) { await odds.click(); await pg.waitForTimeout(4000); }
            const dl = await pg.evaluate(() => { const t = document.getElementById("dlTag"); return t ? t.textContent : ""; });
            const helper = await pg.evaluate(() => typeof window.suimenGet);
            console.log("::notice title=ブラウザ " + process.env.PAGE + "::締切表示 " + dl + " / 読み込み係 " + helper);
            console.log("::notice title=ブラウザが読んだデータ::" + (seen.join(" | ") || "なし"));
            if (errs.length) console.log("::warning title=ブラウザのエラー::" + errs.join(" | ").slice(0, 600));
            await b.close();
          })();
          JS
          node look.js
      - name: DNS が今どこを指しているか
        if: ${{ always() && github.event.inputs.site != '' }}
        env:
          SITE: ${{ github.event.inputs.site }}
        run: |
          command -v dig >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils; }
          d="${SITE#https://}"; d="${d#http://}"; d="${d%%/*}"
          echo "::notice title=DNS ネームサーバー ${d}::$(dig +short NS "$d" @1.1.1.1 | tr '\n' ' ') / .com の登録元: $(dig +norecurse +short NS "$d" @a.gtld-servers.net | tr '\n' ' ')$(dig +norecurse NS "$d" @a.gtld-servers.net | awk '/AUTHORITY SECTION/{f=1;next} f&&NF{printf "%s ", $5}')"
          # 管理しているネームサーバーに直接聞く(途中の使い回し(キャッシュ)をとおさない、いまの本当の中身)
          ns1=$(dig +short NS "$d" @1.1.1.1 | head -1)
          if [ -n "$ns1" ]; then
            for n in "$d" "www.$d" "data.$d" '\064.'"$d"; do
              echo "::notice title=DNS 直接 ${n} (${ns1})::A: $(dig +short A "$n" @"$ns1" | tr '\n' ' ') / CNAME: $(dig +short CNAME "$n" @"$ns1" | tr '\n' ' ')"
            done
          fi
          for n in "$d" "www.$d" "data.$d"; do
            for r in 1.1.1.1 8.8.8.8; do
              echo "::notice title=DNS ${n} (${r})::A: $(dig +short A "$n" @$r | tr '\n' ' ') / AAAA: $(dig +short AAAA "$n" @$r | tr '\n' ' ') / CNAME: $(dig +short CNAME "$n" @$r | tr '\n' ' ')"
            done
          done
      - name: サイトのURLが開けるか
        if: ${{ always() && github.event.inputs.site != '' }}
        env:
          SITE: ${{ github.event.inputs.site }}
        run: |
          for u in "$SITE" "https://www.${SITE#https://}" "https://mikazuki07120609-beep.github.io/boatrace/"; do
            h=$(curl -sS -D - -o page.html "$u" 2>err.txt || true)
            st=$(printf '%s\n' "$h" | head -1 | tr -d '\r')
            loc=$(printf '%s\n' "$h" | grep -i '^location:' | head -1 | tr -d '\r')
            t=$(grep -o '<title>[^<]*' page.html 2>/dev/null | head -1 | sed 's/<title>//')
            echo "::notice title=サイト ${u}::${st} / ${loc} / ${t} $(head -c 160 err.txt | tr -d '\r\n')"
          done
