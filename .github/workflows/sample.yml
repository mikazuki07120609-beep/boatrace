name: 直前情報ページの見本を取る(開発用・一時的)
on:
  workflow_dispatch:
jobs:
  sample:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 見本を取る
        run: |
          mkdir -p sample
          UA="suimen-note/1.0 (+https://mikazuki07120609-beep.github.io/boatrace/)"
          curl -sS -A "$UA" "https://www.boatrace.jp/owpc/pc/race/beforeinfo?rno=1&jcd=12&hd=20261021" -o sample/beforeinfo_12_01.html
          sleep 3
          curl -sS -A "$UA" "https://www.boatrace.jp/owpc/pc/race/beforeinfo?rno=12&jcd=24&hd=20261021" -o sample/beforeinfo_24_12.html
          ls -la sample
      - name: 別のブランチに置く
        run: |
          cd sample
          git init -q -b dev-sample
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "直前情報ページの見本"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dev-sample
