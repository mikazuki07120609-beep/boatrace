name: Cloudflare の置き場所の確認

# Cloudflare R2 の設定がすんだら、手で動かして確かめる(ふだんは動かない)。
#  1. 秘密の値で、確かめ用の小さなファイル(check.json)を R2 に送れるか
#  2. data_base を入れたときは、公開のURLから読めるか(サイトから読むための CORS と、Cloudflare の中継の使い回し)
# 結果は実行の注記(annotation)にも残す(実行の記録を読めないときも、API で確かめられる)。
on:
  workflow_dispatch:
    inputs:
      data_base:
        description: "公開のURL(例: https://data.example.com/)。空なら送るところまで"
        default: ""
      origin:
        description: "サイトのURL(CORS の確認用。例: https://example.com)"
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 確かめ用のファイルを R2 に送る
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 scripts/r2.py --check
      - name: 公開のURLから読めるか(CORS と中継の使い回し)
        if: ${{ github.event.inputs.data_base != '' }}
        env:
          BASE: ${{ github.event.inputs.data_base }}
          ORIGIN: ${{ github.event.inputs.origin }}
        run: |
          u="${BASE%/}/check.json?t=$(date +%s)"
          args=()
          if [ -n "$ORIGIN" ]; then args=(-H "Origin: $ORIGIN"); fi
          for i in 1 2; do
            h=$(curl -sS -D - -o body.txt "${args[@]}" "$u" || true)
            pick() { printf '%s\n' "$h" | grep -i "^$1:" | head -1 | tr -d '\r'; }
            st=$(printf '%s\n' "$h" | head -1 | tr -d '\r')
            echo "::notice title=公開のURL ${i}回目::${st} / $(pick access-control-allow-origin) / $(pick cf-cache-status) / $(pick cache-control) / $(head -c 120 body.txt | tr -d '\r\n')"
            sleep 2
          done
